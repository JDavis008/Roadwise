name: Roadwise
options:
  bundleIdPrefix: com.roadwise
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
targets:
  Roadwise:
    type: application
    platform: iOS
    sources:
      - path: Roadwise
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.roadwise.app
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        # CarPlay navigation entitlement (see CARPLAY.md). Signed builds fail until Apple grants it to the team.
        CODE_SIGN_ENTITLEMENTS: Roadwise/Roadwise.entitlements
    info:
      path: Roadwise/Info.plist
      properties:
        CFBundleDisplayName: Roadwise
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: ""
        # The phone window stays SwiftUI's WindowGroup; the car screen gets CarPlaySceneDelegate.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            CPTemplateApplicationSceneSessionRoleApplication:
              - UISceneClassName: CPTemplateApplicationScene
                UISceneConfigurationName: CarPlay
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).CarPlaySceneDelegate
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - location
          - audio
        NSLocationWhenInUseUsageDescription: Roadwise uses your location to show where you are, plan routes and give turn-by-turn directions.
        NSLocationAlwaysAndWhenInUseUsageDescription: Roadwise keeps using your location while you navigate with the screen off, so voice directions and live sharing keep working.
        ITSAppUsesNonExemptEncryption: false
  RoadwiseUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: RoadwiseUITests
    dependencies:
      - target: Roadwise
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.roadwise.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Roadwise
  RoadwiseTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RoadwiseTests
    dependencies:
      - target: Roadwise
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.roadwise.app.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Roadwise:
    build:
      targets:
        Roadwise: all
        RoadwiseTests: [test]
        RoadwiseUITests: [test]
    test:
      targets:
        - RoadwiseTests
        - RoadwiseUITests
